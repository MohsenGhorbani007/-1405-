<!-- ============ GUIDE ============ -->
<template id="g-guide">
<div class="guide">
  <p>این سیستم <span class="mark">هفت پرامپت</span> داره که پشت سر هم اجرا می‌شن. هر پرامپت خروجی مرحله‌ی قبل رو ورودی می‌گیره، برای همین همه‌شون رو باید <b>توی یه چت</b> اجرا کنی.</p>
  <p>فرقش با پرامپت‌های آماده‌ی اینترنت اینه که AI رو مجبور می‌کنه چیزی از خودش نسازه، قبل از نوشتن از خودت سؤال بپرسه و بعد از نوشتن، متن خودش رو مثل یه ویراستار سخت‌گیر بررسی کنه.</p>

  <h3>مسیر کار</h3>
  <div class="flow" id="flow"></div>

  <h3>قبل از شروع این‌ها رو بدون</h3>
  <ol>
    <li><b>برای هر صفحه یه چت جدید باز کن.</b> اگه چند صفحه رو توی یه چت بنویسی، اطلاعاتشون قاطی می‌شه.</li>
    <li><b>پروفایل کسب‌وکار رو یه بار پر کن و نگهش دار.</b> برای صفحه‌های بعدی فقط کپی‌ش می‌کنی. اگه از Projects توی ChatGPT و Claude یا Gems توی Gemini استفاده می‌کنی، پروفایل رو توی Instructions بذار تا لازم نباشه هر بار بفرستی.</li>
    <li><b>جاهای زرد رو با اطلاعات خودت پر کن.</b> بقیه‌ی متن پرامپت رو دست نزن.</li>
    <li><b>اگه AI نتونست صفحه‌ی رقیب رو باز کنه</b> (توی نسخه‌های رایگان زیاد پیش میاد)، متن صفحه رو کپی کن و براش بفرست. پرامپت‌ها طوری نوشته شدن که به‌جای حدس زدن، بهت بگه.</li>
    <li><b>قبل از انتشار، همه‌ی جاهایی که AI نوشته [از من بپرس] رو پر کن.</b> اون‌ها دقیقاً همون جاهایی‌ان که محتوای تو رو از بقیه جدا می‌کنن.</li>
  </ol>

  <h3>از کدوم مرحله شروع کنم؟</h3>
  <ol>
    <li>صفحه‌ی جدید می‌خوای بنویسی: از <b>S0</b> تا <b>P6</b> به ترتیب.</li>
    <li>صفحه‌ی قدیمی رو می‌خوای آپدیت کنی: <b>S0</b>، بعد <b>P1</b> و <b>P2</b> با آدرس صفحه‌ی فعلی. خودشون حالت آپدیت رو تشخیص می‌دن.</li>
    <li>متن آماده داری و فقط می‌خوای بهترش کنی: <b>S0</b>، بعد <b>P5</b> با متن خودت.</li>
    <li>صفحه منتشر شده و می‌خوای چکش کنی: <b>P6</b>.</li>
  </ol>

  <div class="cta">
    این هفت پرامپت بخش <b>تولید محتوا</b> از یه سیستم بزرگ‌تره. استراتژی، کیورد ریسرچ، کلاسترینگ، تقویم محتوا و تحلیل سرچ کنسول رو توی دوره‌ی جامع سئوی آکادمی دی ام روم قدم‌به‌قدم کار می‌کنیم.

<!-- ============ S0 ============ -->
<template id="p-profile">این پروفایل کسب‌وکار من است. در تمام این چت، هر محتوایی که می‌سازی باید با این اطلاعات هماهنگ باشد.

قوانین این چت:
۱. هیچ آمار، قیمت، مشخصات فنی، نتیجه یا تجربه‌ای از خودت نساز. هر جا چنین چیزی لازم است، جایش بنویس [از من بپرس: چه چیزی لازم است].
۲. اگر نتوانستی صفحه‌ای را باز کنی یا فایلی را بخوانی، صریح بگو و حدس نزن.
۳. اگر می‌توانی کد اجرا کنی، شمارش‌ها (تعداد کلمات، طول Title و Description) را با کد انجام بده. اگر نمی‌توانی، کنار عدد بنویس «تقریبی».
۴. متن فارسی باشد و اصطلاحات فنی سئو انگلیسی.
۵. اگر درخواستی با این پروفایل تناقض دارد (محصولی که نمی‌فروشیم، شهری که خدمت نداریم، ادعایی که ممنوع است)، صریح بگو.

فعلاً فقط این کار را بکن: پروفایل را در ۵ خط خلاصه کن، بخش‌های خالی یا مبهم را لیست کن و منتظر دستور بعدی بمان.

پروفایل کسب‌وکار:
۱. نام برند: [اینجا بنویس]
۲. آدرس سایت: [اینجا بنویس]
۳. چه می‌فروشید یا چه خدمتی می‌دهید (دسته‌ها و محصولات یا خدمات اصلی): [اینجا بنویس]
۴. مشتری اصلی کیست و در چه موقعیتی دنبال شما می‌گردد: [اینجا بنویس]
۵. شهر یا محدوده‌ی خدمت و ارسال: [اینجا بنویس]
۶. بازه‌ی قیمت (اقتصادی، متوسط یا لوکس): [اینجا بنویس]
۷. چرا مشتری از شما می‌خرد و نه از رقیب: [اینجا بنویس]
۸. سندهای اعتماد (سابقه، نمایندگی رسمی، گارانتی، نظر مشتری، عکس واقعی): [اینجا بنویس]
۹. چیزهایی که فقط شما می‌دانید (سؤال‌های رایج مشتری، اشتباه‌های رایج خریدارها، نتیجه‌ی تست یا تجربه): [اینجا بنویس]
۱۰. اسم‌هایی که مشتری برای محصول یا خدمت شما به کار می‌برد، حتی عامیانه: [اینجا بنویس]
۱۱. رقبای اصلی (اسم و آدرس سایت): [اینجا بنویس]
۱۲. لحن برند (مثلاً صمیمی، تخصصی یا رسمی): [اینجا بنویس]
۱۳. ادعاها، موضوع‌ها یا کلمه‌هایی که نباید در محتوا بیاید: [اینجا بنویس]
۱۴. صفحه‌های مهم سایت برای لینک داخلی (آدرس و موضوع هر صفحه) یا آدرس sitemap: [اینجا بنویس]</template>

<!-- ============ P1 ============ -->
<template id="p-competitor">می‌خواهم قبل از نوشتن محتوای یک صفحه، صفحه‌های رقبا در صفحه‌ی اول گوگل را آنالیز کنی تا بفهمیم کاربر دقیقاً چه می‌خواهد و ما چه چیزی می‌توانیم بیشتر از رقبا بدهیم.

منبع اطلاعات رقبا:
۱. اگر متن یا فایل HTML صفحه‌ی رقیب را پیوست کرده‌ام، فقط از همان استفاده کن.
۲. اگر پیوست نکرده‌ام، صفحه را از روی آدرس باز کن.
۳. اگر صفحه‌ای باز نشد، بگو کدام‌ها باز نشد و برای آن‌ها چیزی ننویس. من متنشان را برایت می‌فرستم.

برای هر رقیب این‌ها را دربیاور:
۱. نوع صفحه: مقاله، دسته‌بندی، محصول یا لندینگ خدمات
۲. قالب محتوا: مثلاً راهنمای قدم‌به‌قدم، لیست، مقایسه، جدول‌محور، پرسش و پاسخ
۳. زاویه‌ی محتوا: مثلاً چیستی، راهنمای خرید، بهترین‌ها، مقایسه، حل مشکل
۴. کیوردهای تمرکز: از روی Title، H1 و H2ها
۵. ساختار: H1، همه‌ی H2ها و H3های مهم
۶. تعداد کلمات متن اصلی، بدون منو، فوتر و سایدبار
۷. تعداد عکس، جدول و ویدیو
۸. Title و Meta Description
۹. مهم‌ترین نقطه‌ی قوت و مهم‌ترین ضعف، هر کدام در یک جمله

اگر آدرس صفحه‌ی فعلی ما را هم داده‌ام، آن را مثل رقبا بخوان.

بعد برای صفحه‌ی ما جمع‌بندی کن:
۱. نوع، قالب و زاویه‌ای که بیشتر نتایج صفحه‌ی اول دارند. این نشان می‌دهد گوگل فکر می‌کند کاربر چه می‌خواهد. اگر نتایج با هم فرق دارند، بگو.
۲. موضوع‌های ضروری: موضوع‌هایی که بیشتر رقبا پوشش داده‌اند.
۳. جای خالی: سؤال‌هایی که هیچ رقیبی یا فقط یکی جوابشان را داده.
۴. فرصت Information Gain: چیزی که ما بر اساس پروفایل کسب‌وکار داریم و رقبا ندارند (تجربه، داده، عکس واقعی، نظر متخصص).
۵. محدوده‌ی طول رقبا، فقط به‌عنوان مرجع. طول هدف نیست؛ هدف این است که صفحه‌ی ما به همه‌ی سؤال‌های ضروری و جای خالی‌ها کامل جواب بدهد.
۶. رسانه‌ی پیشنهادی: تعداد عکس، جدول یا ویدیو.
۷. اگر صفحه‌ی فعلی ما را خواندی: صفحه‌ی ما در مقایسه با رقبا چه چیزی کم دارد.

قوانین:
۱. فقط چیزی را بنویس که در صفحه‌ی رقیب دیدی.
۲. رقیب را بر اساس اسم و اعتبار برندش قضاوت نکن؛ فقط محتوای صفحه مهم است.

خروجی:
الف. جدول رقبا: | رقیب | نوع | قالب | زاویه | کیوردهای تمرکز | تعداد کلمات | عکس، جدول، ویدیو | Title | قوت | ضعف |
ب. ساختار تیترهای هر رقیب، جدا.
ج. جمع‌بندی برای صفحه‌ی ما.

صفحه‌ی ما:
[موضوع صفحه، کیورد اصلی، کیوردهای مرتبط و نوع صفحه را اینجا بنویس. اگر صفحه منتشر شده و می‌خواهی آپدیتش کنی، آدرسش را هم بنویس]

آدرس رقبا:
[۳ تا ۵ آدرس از صفحه‌ی اول گوگل را اینجا بنویس. آگهی‌ها و سایت‌هایی که واقعاً رقیب تو نیستند را کنار بگذار]</template>

<!-- ============ P2 ============ -->
<template id="p-brief">از روی آنالیز رقبا و پروفایل کسب‌وکار در همین چت، بریف کامل این صفحه را بساز. بریف باید آن‌قدر دقیق باشد که نویسنده، انسان یا AI، بدون سؤال اضافه بتواند صفحه را بنویسد.
اگر آنالیز رقبا در این چت نیست، کیورد اصلی را جستجو کن و ۳ نتیجه‌ی اول را بخوان. اگر نمی‌توانی جستجو کنی، بگو تا اول آنالیز رقبا را انجام بدهیم.

قدم ۱: شکستن سؤال اصلی (Query Fan-out)
سؤال اصلی کاربر را به ۸ تا ۱۵ زیرسؤال بشکن؛ همان سؤال‌هایی که کاربر بعد از سؤال اصلی می‌پرسد و ابزارهای AI مثل AI Mode گوگل هم برای ساختن جواب جستجو می‌کنند. از کیوردهای صفحه، موضوع‌های ضروری و جای خالی‌های رقبا استفاده کن.
برای هر زیرسؤال مشخص کن جوابش کجا می‌آید: H2، H3، FAQ، لینک به صفحه‌ی دیگری از سایت، یا «حذف» اگر Intent دیگری دارد.

قدم ۲: ساختار بر اساس نوع صفحه
۱. مقاله: H1، مقدمه‌ای که در دو سه جمله‌ی اول جواب مستقیم می‌دهد، فهرست مطالب برای متن بلند، H2 و H3ها، جدول هر جا مقایسه هست، FAQ، دعوت به اقدام به صفحه‌ی فروش مرتبط، معرفی نویسنده.
۲. دسته‌بندی: یک یا دو پاراگراف کوتاه بالای محصولات، لیست محصولات، لینک به زیردسته‌ها، راهنمای انتخاب پایین صفحه (انواع، سایز، مقایسه)، FAQ، لینک به مقاله‌ی راهنمای مرتبط.

   tip:"<b>اگه AI نتونست صفحه‌ای رو باز کنه:</b> صفحه رو توی مرورگر باز کن، متنش رو کپی کن و توی همین چت بفرست."},
  {id:"brief", code:"P2", group:"تحقیق", title:"بریف محتوا",
   desc:"سؤال اصلی کاربر رو به زیرسؤال‌ها می‌شکنه و ساختار کامل صفحه رو بر اساس نوعش (مقاله، دسته، محصول یا لندینگ) با کیورد، لینک داخلی و جای تجربه‌ی واقعی می‌چینه.",
   need:"خروجی P1 در همین چت", out:"بریف کامل نویسنده"},
  {id:"interview", code:"P3", group:"نوشتن", title:"مصاحبه‌ی تجربه", isNew:true,
   desc:"قبل از نوشتن، AI ازت سؤال‌های مشخص می‌پرسه تا تجربه و داده‌ی واقعی خودت وارد متن بشه. این همون مرحله‌ایه که بیشتر آدم‌ها جا می‌ندازن.",
   need:"بریف P2 در همین چت، و ده دقیقه وقت خودت", out:"یادداشت تجربه و جای هر یادداشت در صفحه",
   tip:"<b>نکته:</b> جواب‌هات رو کوتاه ولی مشخص بنویس. «مشتری‌ها معمولاً سایز رو اشتباه انتخاب می‌کنن، چون…» خیلی بهتر از «مشتری‌ها راضی‌ان» کار می‌کنه."},
  {id:"write", code:"P4", group:"نوشتن", title:"نوشتن متن",
   desc:"متن کامل رو دقیقاً از روی بریف و یادداشت تجربه می‌نویسه، با قانون‌های نثر فارسی، و هر جا اطلاعات واقعی لازمه جاش رو خالی می‌ذاره که خودت پر کنی.",

   tip:"<b>گرفتن کد HTML:</b> روی کامپیوتر صفحه رو باز کن، Ctrl+U رو بزن، همه رو کپی کن و توی یه فایل txt ذخیره کن و به چت بده."}

const tabsEl = document.getElementById("tabs"), view = document.getElementById("view");
const prompts = STEPS.filter(s => !s.guide);
let current = "guide";

function promptText(id){ return document.getElementById("p-" + id).content.textContent; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(t){
  return esc(t)
    .replace(/^((?:الف|ب|ج|د|ه|و|ز)\. .+)$/gm,'<b class="hl">$1</b>')
    .replace(/^(قدم [۰-۹]+: .+)$/gm,'<b class="hl">$1</b>')
    .replace(/^([^\n۰-۹:]{2,40}:)$/gm,'<b class="hl">$1</b>')
    .replace(/(\[[^\]\n]*اینجا[^\]\n]*\])/g,'<span class="ph">$1</span>');
}

function renderTabs(){
  let html = "", last = null;
  STEPS.forEach(s => {
    if (s.group !== last){ html += `<div class="grp">${s.group}</div>`; last = s.group; }
    html += `<button class="tab${s.id===current?" active":""}" data-id="${s.id}"><span class="code">${s.code}</span><span class="tt">${s.title}${s.isNew?'<span class="new">جدید</span>':""}</span></button>`;
  });
  tabsEl.innerHTML = html;
  tabsEl.querySelectorAll(".tab").forEach(b => b.onclick = () => show(b.dataset.id));
  const a = tabsEl.querySelector(".active"); if (a && a.scrollIntoView) a.scrollIntoView({block:"nearest",inline:"center"});
}

function show(id){
  current = id;
  const s = STEPS.find(x => x.id === id);
  const i = STEPS.indexOf(s), nx = STEPS[i+1];
  const nextBtn = nx ? `<button class="next" data-id="${nx.id}">مرحله‌ی بعد: ${nx.code} ${nx.title} ←</button>` : "";
  if (s.guide){
    view.innerHTML = `<div class="phead"><h2>${s.title}</h2></div>` + document.getElementById("g-guide").innerHTML + `<div style="margin-top:22px">${nextBtn}</div>`;
    document.getElementById("flow").innerHTML = prompts.map(p => `<div class="st" data-id="${p.id}"><span class="n">${p.code}</span><div><b>${p.title}${p.isNew?' <span class="new" style="font-size:11px;background:var(--green);color:#fff;border-radius:6px;padding:0 6px">جدید</span>':""}</b><span>${p.desc}</span></div></div>`).join("");
    view.querySelectorAll(".st").forEach(e => e.onclick = () => show(e.dataset.id));
  } else {
    const txt = promptText(id);
    view.innerHTML = `
      <div class="phead"><span class="code">${s.code}</span><h2>${s.title}</h2></div>
      <p class="desc">${s.desc}</p>
      <div class="io"><div><b>چی لازم داری</b>${s.need}</div><div><b>چی تحویل می‌گیری</b>${s.out}</div></div>
      ${s.tip ? `<div class="tip">${s.tip}</div>` : ""}
      <div class="box">
        <div class="boxbar"><span class="lbl">پرامپت</span><button class="copy" id="cp">کپی پرامپت</button></div>
        <div class="ptext">${fmt(txt)}</div>
      </div>
      ${nextBtn}
      <footer>سیستم پرامپت تولید محتوای سایت · عماد چابک · <a href="https://dmroom.academy/" target="_blank" rel="noopener">آکادمی دی ام روم</a></footer>`;
    document.getElementById("cp").onclick = e => copy(txt, e.currentTarget);
  }
  const nb = view.querySelector(".next"); if (nb) nb.onclick = () => show(nb.dataset.id);
  renderTabs();
  try { history.replaceState(null, "", "#" + id); } catch(e){}
  window.scrollTo({top:0});
}

function copy(t, btn){
  const ok = () => { btn.classList.add("done"); btn.textContent = "کپی شد ✓"; toast(); setTimeout(() => { btn.classList.remove("done"); btn.textContent = "کپی پرامپت"; }, 1800); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, () => fallback(t, ok));
  else fallback(t, ok);
}
function fallback(t, ok){
  const a = document.createElement("textarea"); a.value = t; a.setAttribute("readonly",""); a.style.position = "fixed"; a.style.opacity = "0";
  document.body.appendChild(a); a.select(); a.setSelectionRange(0, t.length);
  try { document.execCommand("copy"); ok(); } catch(e){} a.remove();
}
function toast(){ const el = document.getElementById("toast"); el.classList.add("show"); setTimeout(() => el.classList.remove("show"), 1500); }

const h = location.hash.slice(1);
show(STEPS.some(s => s.id === h) ? h : "guide");
</script>
